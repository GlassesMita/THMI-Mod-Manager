[Settings]
SectionBepInEx=BepInEx 设定（误操作可能导致游戏原地爆炸）
BepInExConfigPath=配置文件路径（你真的懂吗）
BepInExConfigPathHelp=BepInEx.cfg配置文件路径（不建议乱动）
BepInExEnableAssemblyCache=启用程序集元数据缓存（懂的都懂）
BepInExDetourProvider=重定向提供者（Dobby永远的神）
BepInExHarmonyLogChannels=Harmony日志通道（记录你的操作）
BepInExUpdateInteropAssemblies=更新IL2CPP互操作程序集（这是高端操作）
BepInExUnityBaseLibrariesSource=Unity基础库URL（网上冲浪下载）
BepInExIL2CPPInteropAssembliesPath=IL2CPP互操作程序集路径（在这里在这里）
BepInExPreloadIL2CPPInteropAssemblies=预加载IL2CPP互操作程序集（预加载就是快）
BepInExUnityLogListening=启用Unity日志监听（监听你的游戏）
BepInExConsoleEnabled=启用控制台（搞黄色用的）
BepInExConsolePreventClose=防止控制台关闭（防止不小心关掉）
BepInExConsoleShiftJisEncoding=使用Shift-JIS编码（日本字必备）
BepInExConsoleStandardOutType=标准输出类型（标准输出）
BepInExConsoleLogLevels=控制台日志级别（记录级别）
BepInExDiskLogEnabled=启用磁盘日志记录（记录到磁盘）
BepInExDiskLogAppend=追加到日志文件（追加追加）
BepInExDiskLogLevels=磁盘日志级别（磁盘日志级别）
BepInExDiskLogInstantFlushing=即时刷新日志（即时刷新）
BepInExDiskLogConcurrentFileLimit=并发日志文件限制（并发限制）
BepInExWriteUnityLog=将Unity日志写入磁盘（写入磁盘）
BepInExHarmonyBackend=Harmony后端（Harmony后端）
BepInExDumpAssemblies=转储已修补程序集（转储转储）
BepInExLoadDumpedAssemblies=加载已转储程序集（加载加载）
BepInExBreakBeforeLoadAssemblies=在加载程序集前中断（中断中断）
BepInExWarning=此处的设定建议在指导下进行操作（别乱动，会出事的）
